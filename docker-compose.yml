services:
  amnezia_panel:
    image: ${PANEL_IMAGE:-prvtpro/amnezia-panel:1.4.4}
    container_name: amnezia_panel
    network_mode: host
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
    volumes:
      - amnezia_panel_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.connect(('127.0.0.1', ${APP_PORT:-5000})); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  amnezia_panel_data:
